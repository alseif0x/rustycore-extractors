<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="254" viewBox="0 0 1200 254" role="img" aria-labelledby="title description">
  <title id="title">RustyCore extraction workflow</title>
  <desc id="description">A local client folder and an explicit build and component plan feed local CASC extraction. Versioned component output is then verified offline. Forever development prioritizes Linux.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#101b2e"/>
      <stop offset="1" stop-color="#172c3e"/>
    </linearGradient>
    <linearGradient id="accent">
      <stop stop-color="#63ddd0"/>
      <stop offset="1" stop-color="#8ab4ff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7797ac"/>
    </marker>
  </defs>
  <rect width="1200" height="254" rx="20" fill="url(#background)"/>
  <rect x="32" y="30" width="38" height="4" rx="2" fill="url(#accent)"/>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="82" y="38" fill="#a9c8da" font-size="14" font-weight="600" letter-spacing="2">THE EXTRACTION WORKFLOW</text>
    <rect x="908" y="20" width="260" height="30" rx="15" fill="#223c50"/>
    <circle cx="926" cy="35" r="4" fill="#63ddd0"/>
    <text x="940" y="40" fill="#d6e9f2" font-size="13">Linux first · Forever in development</text>
    <g fill="#15283b" stroke="#385268">
      <rect x="32" y="76" width="252" height="120" rx="12"/>
      <rect x="326" y="76" width="252" height="120" rx="12"/>
      <rect x="620" y="76" width="252" height="120" rx="12"/>
      <rect x="914" y="76" width="254" height="120" rx="12"/>
    </g>
    <g fill="none" stroke="#7797ac" stroke-width="2" marker-end="url(#arrow)">
      <path d="M 292 136 H 316"/>
      <path d="M 586 136 H 610"/>
      <path d="M 880 136 H 904"/>
    </g>
    <g font-size="12" fill="#63ddd0" font-weight="700" letter-spacing="1.5">
      <text x="52" y="102">01 / SELECT</text>
      <text x="346" y="102">02 / EXTRACT</text>
      <text x="640" y="102">03 / PACKAGE</text>
      <text x="934" y="102">04 / VERIFY</text>
    </g>
    <g font-size="23" fill="#f0f6fc" font-weight="650">
      <text x="52" y="136">Client folder</text>
      <text x="346" y="136">Local CASC</text>
      <text x="640" y="136">Versioned output</text>
      <text x="934" y="136">Offline checks</text>
    </g>
    <g font-size="14" fill="#b3c8d9">
      <text x="52" y="166">Explicit build + component plan</text>
      <text x="346" y="166">Read selected client resources</text>
      <text x="640" y="166">Components + integrity metadata</text>
      <text x="934" y="166">Check formats + artifact links</text>
    </g>
    <text x="32" y="230" font-size="13" fill="#a9c8da">DB2 · Game tables · Cameras · Terrain · Collision · Navigation</text>
    <text x="1168" y="230" text-anchor="end" font-size="13" fill="#a9c8da">Support follows explicit build and component profiles.</text>
  </g>
</svg>
