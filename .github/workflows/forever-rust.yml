{
  "name": "Forever Rust synthetic checks",
  "on": {
    "pull_request": {
      "branches": [
        "forever"
      ]
    },
    "push": {
      "branches": [
        "forever"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "forever-rust-${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "env": {
    "CARGO_TERM_COLOR": "always",
    "PYTHONDONTWRITEBYTECODE": "1",
    "PYTHONUTF8": "1",
    "RUSTUP_TOOLCHAIN": "1.98.0"
  },
  "jobs": {
    "linux": {
      "name": "Linux workspace (${{ matrix.profile }})",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 20,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "include": [
            {
              "profile": "debug",
              "profile-flag": ""
            },
            {
              "profile": "release",
              "profile-flag": "--release"
            }
          ]
        }
      },
      "defaults": {
        "run": {
          "shell": "bash"
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "name": "Display explicit build-only download plan",
          "run": "printf '%s\\n' 'Fetch Rust 1.98.0 minimal toolchain, rustfmt/clippy from static.rust-lang.org via rustup checksum verification; fetch Cargo.lock registry archives only. No client, TACT, listfile or native-reference downloads.'",
          "env": {
            "CARGO_TARGET_DIR": "${{ runner.temp }}/forever-rust-target"
          }
        },
        {
          "name": "Install exact Rust version",
          "run": "rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy",
          "env": {
            "CARGO_TARGET_DIR": "${{ runner.temp }}/forever-rust-target"
          }
        },
        {
          "name": "Fetch locked registry closure",
          "run": "cargo fetch --locked",
          "env": {
            "CARGO_TARGET_DIR": "${{ runner.temp }}/forever-rust-target"
          }
        },
        {
          "name": "Check Linux lint policy",
          "if": "matrix.profile == 'debug'",
          "run": "cargo clippy --offline --locked --workspace --all-targets --no-default-features -- -D warnings",
          "env": {
            "CARGO_TARGET_DIR": "${{ runner.temp }}/forever-rust-target"
          }
        },
        {
          "name": "Test Rust workspace on synthetic inputs",
          "run": "cargo test --offline --locked --workspace --all-targets --no-default-features ${{ matrix.profile-flag }}",
          "env": {
            "CARGO_TARGET_DIR": "${{ runner.temp }}/forever-rust-target"
          }
        },
        {
          "name": "Build product and component binaries",
          "run": "cargo build --offline --locked --workspace --bins --no-default-features ${{ matrix.profile-flag }}",
          "env": {
            "CARGO_TARGET_DIR": "${{ runner.temp }}/forever-rust-target"
          }
        },
        {
          "name": "Check source contracts and synthetic Python oracle",
          "if": "matrix.profile == 'debug'",
          "run": "python -m unittest discover -s tests/contracts -p test_forever_ci_contract.py -v\npython -m unittest discover -s tests/contracts -p test_forever_product_contract.py -v\npython -m unittest discover -s tests/contracts -p test_forever_product_keys_contract.py -v\npython -m unittest discover -s tests/contracts -p test_forever_distribution_contract.py -v\npython -m unittest discover -s tests/forever -p test_db2_oracle.py -v\npython -m unittest discover -s tests/forever -p test_metadata_catalog.py -v\npython -m unittest discover -s tests/contracts -p test_forever_windows_read_contract.py -v\npython -m unittest discover -s tests/contracts -p test_forever_windows_consumers_contract.py -v\npython -m unittest discover -s tests/contracts -p test_forever_windows_output_contract.py -v\npython -m unittest discover -s tests/contracts -p test_forever_windows_membership_contract.py -v\npython -m unittest discover -s tests/contracts -p test_forever_product_offmesh_contract.py -v\npython -m unittest discover -s tests/contracts -p test_forever_windows_product_contract.py -v\npython -m unittest discover -s tests/contracts -p test_forever_windows_producer_msvc_contract.py -v\npython -m unittest discover -s tests/contracts -p test_forever_common_execution_contract.py -v\npython -m unittest discover -s tests/contracts -p test_forever_linux_output_links_contract.py -v\npython -m unittest discover -s tests/contracts -p test_forever_linux_map_domain_contract.py -v\npython -m unittest discover -s tests/contracts -p test_forever_product_v9_contract.py -v\npython -m unittest discover -s tests/contracts -p test_forever_product_v10_contract.py -v\npython -m unittest discover -s tests/contracts -p test_forever_product_v11_contract.py -v\npython -m unittest discover -s tests/contracts -p test_forever_product_v12_contract.py -v\npython -m unittest discover -s tests/contracts -p test_forever_product_v13_contract.py -v\npython -m unittest discover -s tests/contracts -p test_forever_product_v14_contract.py -v\npython -m unittest discover -s tests/contracts -p test_forever_product_v16_contract.py -v",
          "env": {
            "CARGO_TARGET_DIR": "${{ runner.temp }}/forever-rust-target"
          }
        },
        {
          "name": "Check product v15 contract and synthetic CLI",
          "if": "matrix.profile == 'debug'",
          "run": "python -m unittest discover -s tests/contracts -p test_forever_product_v15_contract.py -v\ncargo test --offline --locked -p forever-extractor --test product_v15_cli --no-default-features -- --test-threads=1",
          "env": {
            "CARGO_TARGET_DIR": "${{ runner.temp }}/forever-rust-target"
          }
        },
        {
          "name": "Check product v17 contract and synthetic CLI",
          "if": "matrix.profile == 'debug'",
          "run": "python -m unittest discover -s tests/contracts -p test_forever_product_v17_contract.py -v\ncargo test --offline --locked -p forever-extractor --test product_v17_cli --no-default-features -- --test-threads=1",
          "env": {
            "CARGO_TARGET_DIR": "${{ runner.temp }}/forever-rust-target"
          }
        },
        {
          "name": "Check product v18 contract and synthetic CLI",
          "if": "matrix.profile == 'debug'",
          "run": "python -m unittest discover -s tests/contracts -p test_forever_product_v18_contract.py -v\ncargo test --offline --locked -p forever-extractor --test product_v18_cli --no-default-features -- --test-threads=1",
          "env": {
            "CARGO_TARGET_DIR": "${{ runner.temp }}/forever-rust-target"
          }
        },
        {
          "name": "Check product v19 contract and synthetic CLI",
          "if": "matrix.profile == 'debug'",
          "run": "python -m unittest discover -s tests/contracts -p test_forever_product_v19_contract.py -v\ncargo test --offline --locked -p forever-extractor --test product_v19_cli --no-default-features -- --test-threads=1",
          "env": {
            "CARGO_TARGET_DIR": "${{ runner.temp }}/forever-rust-target"
          }
        },
        {
          "name": "Check product v20 contract and synthetic CLI",
          "if": "matrix.profile == 'debug'",
          "run": "python -m unittest discover -s tests/contracts -p test_forever_product_v20_contract.py -v\ncargo test --offline --locked -p forever-extractor --test product_v20_cli --no-default-features -- --test-threads=1",
          "env": {
            "CARGO_TARGET_DIR": "${{ runner.temp }}/forever-rust-target"
          }
        },
        {
          "name": "Check build-70450 DB2 census contract and synthetic CLI",
          "if": "matrix.profile == 'debug'",
          "run": "python -m unittest discover -s tests/contracts -p test_forever_db2_census_contract.py -v\ncargo test --offline --locked -p forever-extractor --test census_db2_cli --no-default-features -- --test-threads=1",
          "env": {
            "CARGO_TARGET_DIR": "${{ runner.temp }}/forever-rust-target"
          }
        },
        {
          "name": "Exercise synthetic metadata CLI",
          "env": {
            "FOREVER_DB2_INSPECT": "${{ runner.temp }}/forever-rust-target/${{ matrix.profile }}/forever-db2-inspect",
            "CARGO_TARGET_DIR": "${{ runner.temp }}/forever-rust-target"
          },
          "run": "python -m unittest discover -s tests/forever -p test_metadata_cli.py -v"
        }
      ]
    },
    "windows": {
      "name": "Windows workspace read consumers and output guards",
      "runs-on": "windows-2022",
      "timeout-minutes": 20,
      "defaults": {
        "run": {
          "shell": "pwsh"
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "name": "Display explicit build-only download plan",
          "run": "Write-Output 'Fetch Rust 1.98.0 minimal toolchain and clippy from static.rust-lang.org via rustup checksum verification; fetch Cargo.lock registry archives only. No client, TACT, listfile or native-reference downloads.'",
          "env": {
            "CARGO_TARGET_DIR": "${{ runner.temp }}/forever-rust-target"
          }
        },
        {
          "name": "Install exact Rust version",
          "run": "rustup toolchain install 1.98.0 --profile minimal --component clippy\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }",
          "env": {
            "CARGO_TARGET_DIR": "${{ runner.temp }}/forever-rust-target"
          }
        },
        {
          "name": "Fetch locked registry closure",
          "run": "cargo fetch --locked\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }",
          "env": {
            "CARGO_TARGET_DIR": "${{ runner.temp }}/forever-rust-target"
          }
        },
        {
          "name": "Preflight native producer PE directory profile",
          "run": "$ErrorActionPreference = 'Stop'\n. ./tools/check_forever_windows_product.ps1 -PePreflight",
          "env": {
            "CARGO_TARGET_DIR": "${{ runner.temp }}/forever-rust-target"
          }
        },
        {
          "name": "Check explicit MSVC v2 producer lint policy",
          "run": "cargo clippy --offline --locked -p forever-platform -p forever-extractor --all-targets --no-default-features --features forever-extractor/windows-msvc-seal-v2 -- -D warnings\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }",
          "env": {
            "CARGO_TARGET_DIR": "${{ runner.temp }}/forever-rust-target"
          }
        },
        {
          "name": "Test Rust workspace on synthetic inputs",
          "run": "cargo test --offline --locked --workspace --all-targets --no-default-features\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }",
          "env": {
            "CARGO_TARGET_DIR": "${{ runner.temp }}/forever-rust-target"
          }
        },
        {
          "name": "Test Windows private output (debug; fixed NTFS)",
          "run": "$ErrorActionPreference = 'Stop'\n$temporaryRoot = [IO.Path]::GetFullPath($env:RUNNER_TEMP)\nif ($temporaryRoot -notmatch '^[A-Za-z]:\\\\') { throw 'native output tests require a normal local drive path' }\n$volume = Get-Volume -DriveLetter $temporaryRoot.Substring(0, 1)\nif ($volume.FileSystem -ne 'NTFS' -or $volume.DriveType -ne 'Fixed') { throw 'native output tests require fixed local NTFS' }\nWrite-Output ('Native private output fixture volume: fixed NTFS; OS=' + [Environment]::OSVersion.VersionString)\n$env:TEMP = $temporaryRoot\n$env:TMP = $temporaryRoot\n$contract = Get-Content -Raw -Encoding UTF8 contracts/forever-windows-output-contract-v1.json | ConvertFrom-Json\n$expected = @($contract.validation.native_test_names | ForEach-Object { \"windows::output::tests::${_}: test\" } | Sort-Object)\nif ($expected.Count -eq 0) { throw 'empty native output test inventory' }\ncargo test --offline --locked -p forever-platform --lib --no-default-features windows::output::tests:: -- --list --color never | Tee-Object -Variable listing\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\n$listed = @($listing | Where-Object { $_ -match '^windows::output::tests::[a-z0-9_]+: test$' } | Sort-Object)\nif ([string]::Join(\"`n\", $listed) -cne [string]::Join(\"`n\", $expected)) { throw 'native output test inventory mismatch' }\nWrite-Output \"Selected exactly $($expected.Count) native output tests\"\ncargo test --offline --locked -p forever-platform --lib --no-default-features windows::output::tests:: -- --test-threads=1 --color never | Tee-Object -Variable results\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\n$summary = '^test result: ok\\. ' + $expected.Count + ' passed; 0 failed; 0 ignored;'\nif (@($results | Where-Object { $_ -match $summary }).Count -ne 1) { throw 'native output result count mismatch' }\n",
          "env": {
            "CARGO_TARGET_DIR": "${{ runner.temp }}/forever-rust-target"
          }
        },
        {
          "name": "Test Windows private output (release; fixed NTFS)",
          "run": "$ErrorActionPreference = 'Stop'\n$temporaryRoot = [IO.Path]::GetFullPath($env:RUNNER_TEMP)\nif ($temporaryRoot -notmatch '^[A-Za-z]:\\\\') { throw 'native output tests require a normal local drive path' }\n$volume = Get-Volume -DriveLetter $temporaryRoot.Substring(0, 1)\nif ($volume.FileSystem -ne 'NTFS' -or $volume.DriveType -ne 'Fixed') { throw 'native output tests require fixed local NTFS' }\nWrite-Output ('Native private output fixture volume: fixed NTFS; OS=' + [Environment]::OSVersion.VersionString)\n$env:TEMP = $temporaryRoot\n$env:TMP = $temporaryRoot\n$contract = Get-Content -Raw -Encoding UTF8 contracts/forever-windows-output-contract-v1.json | ConvertFrom-Json\n$expected = @($contract.validation.native_test_names | ForEach-Object { \"windows::output::tests::${_}: test\" } | Sort-Object)\nif ($expected.Count -eq 0) { throw 'empty native output test inventory' }\ncargo test --offline --locked -p forever-platform --lib --no-default-features --release windows::output::tests:: -- --list --color never | Tee-Object -Variable listing\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\n$listed = @($listing | Where-Object { $_ -match '^windows::output::tests::[a-z0-9_]+: test$' } | Sort-Object)\nif ([string]::Join(\"`n\", $listed) -cne [string]::Join(\"`n\", $expected)) { throw 'native output test inventory mismatch' }\nWrite-Output \"Selected exactly $($expected.Count) native output tests\"\ncargo test --offline --locked -p forever-platform --lib --no-default-features --release windows::output::tests:: -- --test-threads=1 --color never | Tee-Object -Variable results\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\n$summary = '^test result: ok\\. ' + $expected.Count + ' passed; 0 failed; 0 ignored;'\nif (@($results | Where-Object { $_ -match $summary }).Count -ne 1) { throw 'native output result count mismatch' }\n",
          "env": {
            "CARGO_TARGET_DIR": "${{ runner.temp }}/forever-rust-target"
          }
        },
        {
          "name": "Test Windows private membership (debug; fixed NTFS)",
          "run": "$ErrorActionPreference = 'Stop'\n$temporaryRoot = [IO.Path]::GetFullPath($env:RUNNER_TEMP)\nif ($temporaryRoot -notmatch '^[A-Za-z]:\\\\') { throw 'native membership tests require a normal local drive path' }\n$volume = Get-Volume -DriveLetter $temporaryRoot.Substring(0, 1)\nif ($volume.FileSystem -ne 'NTFS' -or $volume.DriveType -ne 'Fixed') { throw 'native membership tests require fixed local NTFS' }\nWrite-Output ('Native private membership fixture volume: fixed NTFS; OS=' + [Environment]::OSVersion.VersionString)\n$env:TEMP = $temporaryRoot\n$env:TMP = $temporaryRoot\n$contract = Get-Content -Raw -Encoding UTF8 contracts/forever-windows-membership-contract-v1.json | ConvertFrom-Json\n$expected = @($contract.validation.native_test_names | ForEach-Object { \"windows::output::membership::tests::${_}: test\" } | Sort-Object)\nif ($expected.Count -eq 0) { throw 'empty native membership test inventory' }\ncargo test --offline --locked -p forever-platform --lib --no-default-features windows::output::membership::tests:: -- --list --color never | Tee-Object -Variable listing\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\n$listed = @($listing | Where-Object { $_ -match '^windows::output::membership::tests::[a-z0-9_]+: test$' } | Sort-Object)\nif ([string]::Join(\"`n\", $listed) -cne [string]::Join(\"`n\", $expected)) { throw 'native membership test inventory mismatch' }\nWrite-Output \"Selected exactly $($expected.Count) native membership tests\"\ncargo test --offline --locked -p forever-platform --lib --no-default-features windows::output::membership::tests:: -- --test-threads=1 --color never | Tee-Object -Variable results\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\n$summary = '^test result: ok\\. ' + $expected.Count + ' passed; 0 failed; 0 ignored;'\nif (@($results | Where-Object { $_ -match $summary }).Count -ne 1) { throw 'native membership result count mismatch' }\n",
          "env": {
            "CARGO_TARGET_DIR": "${{ runner.temp }}/forever-rust-target"
          }
        },
        {
          "name": "Test Windows private membership (release; fixed NTFS)",
          "run": "$ErrorActionPreference = 'Stop'\n$temporaryRoot = [IO.Path]::GetFullPath($env:RUNNER_TEMP)\nif ($temporaryRoot -notmatch '^[A-Za-z]:\\\\') { throw 'native membership tests require a normal local drive path' }\n$volume = Get-Volume -DriveLetter $temporaryRoot.Substring(0, 1)\nif ($volume.FileSystem -ne 'NTFS' -or $volume.DriveType -ne 'Fixed') { throw 'native membership tests require fixed local NTFS' }\nWrite-Output ('Native private membership fixture volume: fixed NTFS; OS=' + [Environment]::OSVersion.VersionString)\n$env:TEMP = $temporaryRoot\n$env:TMP = $temporaryRoot\n$contract = Get-Content -Raw -Encoding UTF8 contracts/forever-windows-membership-contract-v1.json | ConvertFrom-Json\n$expected = @($contract.validation.native_test_names | ForEach-Object { \"windows::output::membership::tests::${_}: test\" } | Sort-Object)\nif ($expected.Count -eq 0) { throw 'empty native membership test inventory' }\ncargo test --offline --locked -p forever-platform --lib --no-default-features --release windows::output::membership::tests:: -- --list --color never | Tee-Object -Variable listing\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\n$listed = @($listing | Where-Object { $_ -match '^windows::output::membership::tests::[a-z0-9_]+: test$' } | Sort-Object)\nif ([string]::Join(\"`n\", $listed) -cne [string]::Join(\"`n\", $expected)) { throw 'native membership test inventory mismatch' }\nWrite-Output \"Selected exactly $($expected.Count) native membership tests\"\ncargo test --offline --locked -p forever-platform --lib --no-default-features --release windows::output::membership::tests:: -- --test-threads=1 --color never | Tee-Object -Variable results\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\n$summary = '^test result: ok\\. ' + $expected.Count + ' passed; 0 failed; 0 ignored;'\nif (@($results | Where-Object { $_ -match $summary }).Count -ne 1) { throw 'native membership result count mismatch' }\n",
          "env": {
            "CARGO_TARGET_DIR": "${{ runner.temp }}/forever-rust-target"
          }
        },
        {
          "name": "Build product and component binaries",
          "run": "cargo build --offline --locked --workspace --bins --no-default-features\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }",
          "env": {
            "CARGO_TARGET_DIR": "${{ runner.temp }}/forever-rust-target"
          }
        },
        {
          "name": "Check source contracts and synthetic Python oracle",
          "run": "python -m unittest discover -s tests/contracts -p test_forever_ci_contract.py -v\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\npython -m unittest discover -s tests/contracts -p test_forever_product_contract.py -v\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\npython -m unittest discover -s tests/contracts -p test_forever_product_keys_contract.py -v\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\npython -m unittest discover -s tests/contracts -p test_forever_distribution_contract.py -v\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\npython -m unittest discover -s tests/forever -p test_db2_oracle.py -v\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\npython -m unittest discover -s tests/forever -p test_metadata_catalog.py -v\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\npython -m unittest discover -s tests/contracts -p test_forever_windows_read_contract.py -v\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\npython -m unittest discover -s tests/contracts -p test_forever_windows_consumers_contract.py -v\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\npython -m unittest discover -s tests/contracts -p test_forever_windows_output_contract.py -v\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\npython -m unittest discover -s tests/contracts -p test_forever_windows_membership_contract.py -v\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\npython -m unittest discover -s tests/contracts -p test_forever_product_offmesh_contract.py -v\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\npython -m unittest discover -s tests/contracts -p test_forever_windows_product_contract.py -v\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\npython -m unittest discover -s tests/contracts -p test_forever_windows_producer_msvc_contract.py -v\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\npython -m unittest discover -s tests/contracts -p test_forever_common_execution_contract.py -v\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }",
          "env": {
            "CARGO_TARGET_DIR": "${{ runner.temp }}/forever-rust-target"
          }
        },
        {
          "name": "Exercise synthetic metadata CLI",
          "env": {
            "FOREVER_DB2_INSPECT": "${{ runner.temp }}/forever-rust-target/debug/forever-db2-inspect.exe",
            "CARGO_TARGET_DIR": "${{ runner.temp }}/forever-rust-target"
          },
          "run": "python -m unittest discover -s tests/forever -p test_metadata_cli.py -v\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }"
        }
      ]
    },
    "windows-product": {
      "name": "Windows resident product and package recovery",
      "runs-on": "windows-2022",
      "timeout-minutes": 20,
      "defaults": {
        "run": {
