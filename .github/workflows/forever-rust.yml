          "env": {
            "CARGO_TARGET_DIR": "${{ runner.temp }}/forever-rust-target"
          }
        },
        {
          "name": "Preflight native producer PE directory profile",
          "run": "$ErrorActionPreference = 'Stop'\n. ./tools/check_forever_windows_product.ps1 -PePreflight",
          "env": {
            "CARGO_TARGET_DIR": "${{ runner.temp }}/forever-rust-target"
          }
        },
        {
          "name": "Check explicit MSVC v2 producer lint policy",
          "run": "cargo clippy --offline --locked -p forever-platform -p forever-extractor --all-targets --no-default-features --features forever-extractor/windows-msvc-seal-v2 -- -D warnings\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }",
          "env": {
            "CARGO_TARGET_DIR": "${{ runner.temp }}/forever-rust-target"
          }
        },
